media: public/images/uploads

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: tag
        label: Category
        type: select
        options:
          values:
            - development
            - design
            - user experience

      - name: body
        label: Article
        type: rich-text
